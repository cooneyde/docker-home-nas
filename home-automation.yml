services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /mnt/appdata/docker/volumes/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /etc/ssl/certs:/etc/ssl/certs
    privileged: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    restart: always
    network_mode: host  # listens on 8123 directly; port mappings don't apply
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/home-assistant.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8123]"
    # networks: 
    #   bridge-net-0:
    #     ipv4_address: 172.16.1.10

  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - /mnt/appdata/docker/volumes/matter-server:/data
      - /run/dbus:/run/dbus:ro
    privileged: true
    networks:
      bridge-net-0:
        ipv4_address: 172.16.1.11
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/matter.png"
networks: 
  bridge-net-0:
    external: true
