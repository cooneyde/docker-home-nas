services:
  homeassistant:
    container_name: homeassistant
    image: lscr.io/linuxserver/homeassistant:latest
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /volume1/Docker/volumes/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    restart: always

  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - /volume1/Docker/volumes/matter-server:/data
      - /run/dbus:/run/dbus:ro
    privileged: true 
    networks: 
      bridge-net-0:
        ipv4_address: 172.16.1.11
networks: 
  bridge-net-0:
    external: true
