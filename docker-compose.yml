services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ee
    restart: always
    dns:
      - 1.1.1.1
    networks: 
      bridge-net-0: {}
    ports:
      - 9000:9000
    entrypoint: /portainer -p :9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/appdata/docker/volumes/portainer:/data
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/portainer.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:9000]"
networks: 
  bridge-net-0:
    external: true