services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - VERSION=docker
      - TZ=Europe/Dublin
      - ADVERTISE_IP=http://192.168.114.29:32400
    volumes:
      - /mnt/appdata/docker/volumes/plex:/config
      - /mnt/user/tv:/tv
      - /mnt/user/sports:/sports
      - /mnt/user/movies:/movies
      - /mnt/user/transcode:/transcode
    restart: always
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: "curl -f http://localhost:32400/identity"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/plex.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:32400]/web"
  # xteve:
  #   image: alturismo/xteve
  #   container_name: xteve
  #   ports:
  #     - 34400:34400
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Europe/Dublin
  #   volumes:
  #     - /volume1/Docker/volumes/xteve:/config
  #   restart: unless-stopped
  #   networks:
  #     bridge-net-0: {}
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /mnt/user/docker/volumes/radarr:/config
      - /mnt/user/movies:/movies
      - /mnt/user/downloads:/downloads
    ports:
      - 7878:7878
    restart: always
    depends_on:
      - deluge
      - prowlarr
    healthcheck:
      test: "curl -f http://localhost:7878"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/radarr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:7878]"
    networks: 
      bridge-net-0: {}
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - VERSION=docker
      - TZ=Europe/Dublin
    ports:
      - 8989:8989
    volumes:
      - /mnt/appdata/docker/volumes/sonarr:/config
      - /mnt/user/tv:/tv
      - /mnt/user/downloads:/downloads
    restart: always
    depends_on:
      - prowlarr
      - deluge
    healthcheck:
      test: "curl -f http://localhost:8989"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/sonarr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8989]"
    networks: 
      bridge-net-0: {}
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Dublin
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /mnt/user/docker/volumes/seerr/config:/app/config
    networks: 
      bridge-net-0: {}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jellyseerr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:5055]"
  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    environment:
      - TZ=Europe/Dublin
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/appdata/docker/volumes/deluge:/config
      - /mnt/user/downloads:/downloads
    ports:
      - 8112:8112
    restart: always
    healthcheck:
      test: "curl -f http://localhost:8112"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/deluge.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8112]"
    networks:
      bridge-net-0: {} 
  sportarr:
    image: sportarr/sportarr:latest
    container_name: sportarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Europe/Dublin
    volumes:
      - /mnt/appdata/docker/volumes/sportarr/config:/config
      - /mnt/user/sports:/data
      - /mnt/user/downloads:/downloads
    ports:
      - 1867:1867
    restart: always
    depends_on:
      - prowlarr
      - deluge
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/sportarr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:1867]"
    networks:
      bridge-net-0: {}
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      -  /mnt/appdata/docker/volumes/prowlarr/data:/config
    restart: always
    ports:
      - 9696:9696
    healthcheck:
      test: "curl -f http://localhost:9696"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/prowlarr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:9696]"
    networks: 
      bridge-net-0: {}
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Dublin
      - CAPTCHA_SOLVER=none
    ports:
      - 8191:8191
    restart: always
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/flaresolverr.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8191]"
    networks:
      bridge-net-0: {}
networks: 
  br0:
    external: true
  bridge-net-0:
    external: true