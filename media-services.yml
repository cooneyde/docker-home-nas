version: '3'
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - VERSION=docker
      - ADVERTISE_IP=http://cooneyde.myasustor.com:32400,http://192.168.114.2:32400
    volumes:
      - /volume1/Docker/volumes/plex:/config
      - /volume1/Video/tv-shows:/tv
      - /volume1/Video/Movies:/movies
      - /volume1/Video/transcode:/transcode
    labels:
      - homepage.group=Media
      - homepage.name=Plex
      - homepage.icon=plex.png
      - homepage.href=http://192.168.114.2:32400/
      - homepage.description=Plex Media Server
    restart: always
    devices:
      - /dev/dri:/dev/dri
    # networks:
    #   bridge-net-0: {}
    # ports:
    #   - 32400:32400/tcp    # Core Plex (required)
    #   - 32410:32410/udp    # GDM discovery (optional but helpful)
    #   - 32412:32412/udp
    #   - 32413:32413/udp
    #   - 32414:32414/udp
    #   - 8324:8324/tcp
    healthcheck:
      test: "curl -f http://localhost:32400/identity"
      interval: 10s
      timeout: 10s
      retries: 3
  # xteve:
  #   image: alturismo/xteve
  #   container_name: xteve
  #   ports:
  #     - 34400:34400
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Europe/London
  #   volumes:
  #     - /volume1/Docker/volumes/xteve:/config
  #   restart: unless-stopped
  #   networks:
  #     bridge-net-0: {}
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /volume1/Docker/volumes/radarr:/config
      - /volume1/Video/Movies:/movies
      - /volume1/Download:/downloads
    ports:
      - 7878:7878
    restart: always
    depends_on:
      - deluge
      - prowlarr
    labels:
      - homepage.group=Media
      - homepage.name=radarr
      - homepage.icon=radarr.png
      - homepage.href=http://192.168.114.2:7878/
      - homepage.description=Radarr - movies
    healthcheck:
      test: "curl -f http://localhost:7878"
      interval: 10s
      timeout: 10s
      retries: 3
    networks: 
      bridge-net-0: {}
      # docker-net-0:
      #   ipv4_address: 192.168.114.106
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - VERSION=docker
      - TZ=Europe/London
    ports:
      - 8989:8989
    volumes:
      - /volume1/Docker/volumes/sonarr:/config
      - /volume1/Video/tv-shows:/tv
      - /volume1/Download:/downloads
    restart: always
    depends_on:
      - prowlarr
      - deluge
    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=http://192.168.114.2:8989/
      - homepage.description=Sonarr - tv
    healthcheck:
      test: "curl -f http://localhost:8989"
      interval: 10s
      timeout: 10s
      retries: 3
    networks: 
      bridge-net-0: {}
      # docker-net-0:
      #   ipv4_address: 192.168.114.107
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    ports:
      - 5055:5055
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /volume1/Docker/volumes/overseerr/config:/config
    healthcheck:
      test: "curl -f http://localhost:5055"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Media
      - homepage.name=overseerr
      - homepage.icon=overseerr.png
      - homepage.href=http://192.168.114.2:5055/
      - homepage.description=Overseerr - requests
    networks: 
      # docker-net-0:
      #   ipv4_address: 192.168.114.108
      bridge-net-0: {}
    restart: always
  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
    volumes:
      - /volume1/Docker/volumes/deluge:/config
      - /volume1/Download:/downloads
    ports:
      - 8112:8112
    restart: always
    healthcheck:
      test: "curl -f http://localhost:8112"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Media
      - homepage.name=Deluge
      - homepage.icon=deluge.png
      - homepage.href=http://192.168.114.2:8112/
      - homepage.description=Deluge - Torrent Client
    networks:
      bridge-net-0: {} 
      # docker-net-0:
      #   ipv4_address: 192.168.114.109
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - DOCKER_MODS=lscr.io/linuxserver/mods:universal-stdout-logs
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      -  /volume1/Docker/volumes/prowlarr/data:/config
    restart: always
    ports:
      - 9696:9696
    healthcheck:
      test: "curl -f http://localhost:9696"
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Media
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr.png
      - homepage.href=http://192.168.114.2:9696/
      - homepage.description=Prowlarr Indexer Manager
    networks: 
      # docker-net-0:
      #   ipv4_address: 192.168.114.111
      bridge-net-0: {}
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/London
      - CAPTCHA_SOLVER=none
    ports:
      - 8191:8191
    restart: always
    labels:
      - homepage.group=Networking
      - homepage.name=Flaresolverr
      - homepage.icon=flaresolverr.png
      - homepage.href=http://192.168.114.2:8191/
      - homepage.description=Flaresolverr - proxy bypass cloudflare
    networks:
      bridge-net-0: {}
networks: 
  docker-net-0:
    external: true
  bridge-net-0:
    external: true