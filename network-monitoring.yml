# ============================================================
#  Network Monitoring Stack (fully self-hosted, no cloud accounts)
#  - Speedtest Tracker: scheduled Ookla speedtests with history
#  - Uptime Kuma:       ping latency / packet loss to router, Virgin, DNS
#
#  Setup:
#    1. Add SPEEDTEST_APP_KEY to .env next to this file. Generate one with:
#         echo "base64:$(openssl rand -base64 32)"
#    2. Start the stack
#    3. Speedtest Tracker: http://unraid-ip:8765
#       (default login admin@example.com / password - change it)
#    4. Uptime Kuma: http://unraid-ip:3001 - create an account, then add
#       Ping monitors (see README for the target list)
# ============================================================

services:

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=http://192.168.114.2:8765
      - DB_CONNECTION=sqlite
      - DISPLAY_TIMEZONE=Europe/Dublin
      - SPEEDTEST_SCHEDULE=7 * * * *  # hourly, at 7 minutes past
      - PRUNE_RESULTS_OLDER_THAN=180  # days
    volumes:
      - /mnt/appdata/docker/volumes/speedtest-tracker/config:/config
    ports:
      - 8765:80
    restart: always
    networks:
      bridge-net-0: {}
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/speedtest-tracker.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:80]"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      - TZ=Europe/Dublin
    volumes:
      - /mnt/appdata/docker/volumes/uptime-kuma/data:/app/data
    ports:
      - 3001:3001
    restart: always
    networks:
      bridge-net-0: {}
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/uptime-kuma.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:3001]"
networks:
  bridge-net-0:
    external: true
