version: '3'
services: 
  nginx-internal:
    container_name: nginx-internal
    restart: always
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - 80:80
      - 81:81
    environment:
      DISABLE_IPV6: 'true'
      DB_MYSQL_HOST:  "nginx-internal-db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
    dns:
      - 127.0.0.1
      - 1.1.1.1
    networks: 
      docker-net-0:
        ipv4_address: 192.168.114.101
      bridge-net-0: {}
    volumes:
      - /volume1/Docker/volumes/nginx-proxy-manager/data:/data
      - /usr/builtin/etc/certificate:/etc/ssl/certs
      - /volume1/.@plugins/AppCentral/letsencrypt/.CertBot/config/live:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    depends_on:
      - nginx-internal-db
  nginx-internal-db:
    container_name: nginx-internal-db
    restart: always
    image: mariadb:lts
    environment:
      PUID: 1000
      PGID: 1000
      MYSQL_ROOT_PASSWORD: 'npm'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'npm'
    networks: 
      docker-net-0: 
        ipv4_address: 192.168.114.102
    volumes:
      - /volume1/Docker/volumes/nginx-proxy-manager/database:/var/lib/mysql
    healthcheck:
      test: "healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 21600
    restart: always
  nginx-external:
    container_name: nginx-external
    image: lscr.io/linuxserver/nginx:latest
    networks:
      bridge-net-0: {}
    ports:
      - 443:443
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /volume1/Docker/volumes/nginx-external/config:/config
      - /usr/builtin/etc/certificate:/etc/ssl/certs:ro
      - /usr/builtin/etc/certificate:/config/keys:ro
    healthcheck:
      test: "curl -fk https://localhost"
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    networks: 
      bridge-net-0: {}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - 32680:80
    volumes:
      - /volume1/Docker/volumes/nextcloud/data:/data
      - /volume1/Docker/volumes/nextcloud/config:/config
    healthcheck:
      test: 'occ status 2>/dev/null | grep -e "installed: true" -e "maintenance: false" -e "needsDbUpgrade: false" | wc -l | [ "`cat`" = "3" ]'
      interval: 60s
      retries: 5
      start_period: 10s
      timeout: 10s
    restart: always
    depends_on:
      - nextcloud-db
  
  nextcloud-db:
    image: mariadb:lts
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      bridge-net-0: {}
    ports:
      - "6606:3306"
    volumes:
      - /volume1/Docker/volumes/nextcloud/database:/var/lib/mysql
      - /volume1/Docker/volumes/nextcloud/database/conf.d:/etc/mysql/conf.d
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=my-cool-bicycle
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=my-next-bicycle-cloud
    healthcheck:
      test: "healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: ["redis-server", "/data/redis.conf"]
    ports:
      - 6379:6379
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /volume1/Docker/volumes/redis/data:/data
    networks:
      bridge-net-0: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
networks: 
  docker-net-0:
    external: true
  docker-net-1:
    external: true
  bridge-net-0: 
    external: true