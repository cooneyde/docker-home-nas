services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome
    dns:
      - 1.1.1.1
    ports:
      - 53:53/tcp # plain dns over tcp
      - 53:53/udp # plain dns over udp
      - 8081:80/tcp # http web interface
    networks: 
      br0:
        ipv4_address: 192.168.114.4 #static address you want on the container
      bridge-net-0: {}
    environment: 
      TZ: 'Europe/Dublin'
    volumes: 
      - /mnt/appdata/docker/volumes/adguardhome/workdir:/opt/adguardhome/work
      - /mnt/appdata/docker/volumes/adguardhome/confdir:/opt/adguardhome/conf
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/adguard-home.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:80]"
    restart: always
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    volumes:
      - /mnt/appdata/docker/volumes/backrest/config:/config
      - /mnt/appdata/docker/volumes/backrest/cache:/cache
      - /mnt/appdata/docker/volumes/backrest/data:/data
      - /mnt/appdata:/backups/appdata
      - /mnt/user:/backups/user
      - /mnt/disks/Seagate_Expansion_Drive:/repos/4tb
      - /mnt/disks/WCJBZY90-part2:/repos/5tb
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TZ=Europe/Dublin
    ports:
      - 9898:9898
    networks:
      bridge-net-0: {}
    restart: always
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/backrest.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:9898]"

  nginx-internal:
    container_name: nginx-internal
    restart: always
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - 90:80
      - 81:81
    environment:
      DISABLE_IPV6: 'true'
      DB_MYSQL_HOST:  "nginx-internal-db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
    dns:
      - 1.1.1.1
    networks: 
      br0:
        ipv4_address: 192.168.114.101
      bridge-net-0: {}
    volumes:
      - /mnt/appdata/docker/volumes/nginx-proxy-manager/data:/data
      - /mnt/appdata/docker/volumes/nginx-proxy-manager/letsencrypt:/etc/letsencrypt 
      - /etc/ssl/certs:/etc/ssl/certs
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/nginx-proxy-manager.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:81]"
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    depends_on:
      - nginx-internal-db
  nginx-internal-db:
    container_name: nginx-internal-db
    restart: always
    image: mariadb:lts
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=npm
      - MYSQL_DATABASE=npm
      - MYSQL_USER=npm
      - MYSQL_PASSWORD=npm
      - MARIADB_AUTO_UPGRADE=1
    networks: 
      bridge-net-0: {}
    volumes:
      - /mnt/appdata/docker/volumes/nginx-proxy-manager/database:/var/lib/mysql
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/mariadb.png"
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/watchtower.png"
    command: --cleanup --interval 43200  # 12 hours (43200 seconds)
    restart: always
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    networks: 
      bridge-net-0: {}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    ports:
      - 32680:80
    volumes:
      - /mnt/user/media/nextcloud/data:/data
      - /mnt/appdata/docker/volumes/nextcloud/config:/config
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/nextcloud.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:80]"
    healthcheck:
      test: 'occ status 2>/dev/null | grep -e "installed: true" -e "maintenance: false" -e "needsDbUpgrade: false" | wc -l | [ "`cat`" = "3" ]'
      interval: 60s
      retries: 5
      start_period: 10s
      timeout: 10s
    restart: always
    depends_on:
      - nextcloud-db
  nextcloud-db:
    image: mariadb:lts
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      bridge-net-0: {}
    volumes:
      - /mnt/appdata/docker/volumes/nextcloud/database:/var/lib/mysql
      - /mnt/appdata/docker/volumes/nextcloud/database/conf.d:/etc/mysql/conf.d
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - MYSQL_ROOT_PASSWORD=my-cool-bicycle
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=my-next-bicycle-cloud
      - MARIADB_AUTO_UPGRADE=1
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/mariadb.png"
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: ["redis-server", "/data/redis.conf"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /mnt/appdata/docker/volumes/redis/data:/data
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/redis.png"
    networks:
      bridge-net-0:
        # Nextcloud connects with this name: plain `redis` also resolves to Immich's Redis
        aliases:
          - nextcloud-redis
    healthcheck:
      test: "redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 3
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - 8083:8080
    networks:
      bridge-net-0: {}
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/dozzle.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8080]"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always  
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/cloudflare.png"
    networks:
      bridge-net-0: {}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: host  # needs the host firewall to apply bans
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - VERBOSITY=-vv
    volumes:
      - /mnt/appdata/docker/volumes/fail2ban:/config  # copy ./fail2ban/* into /config/fail2ban/
      - /var/log:/var/log:ro  # Unraid syslog (SSH, web GUI and Immich logins)
      - /mnt/appdata/docker/volumes/nextcloud/config/log/nextcloud:/remotelogs/nextcloud:ro
      - /mnt/user/docker/volumes/seerr/config/logs:/remotelogs/seerr:ro
    labels:
      - "net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/fail2ban.png"
    restart: always

networks: 
  br0:
    external: true
  bridge-net-0: 
    external: true