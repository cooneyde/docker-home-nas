version: '3'
services: 
  nginx-internal:
    container_name: nginx-internal
    restart: always
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - 80:80
      - 81:81
    environment:
      DB_MYSQL_HOST:  "nginx-internal-db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
      DISABLE_IPV6: true
    dns:
      - 127.0.0.1
      - 1.1.1.1
    networks: 
      docker-net-0:
        ipv4_address: 192.168.114.101
      bridge-net-0: {}
    volumes:
      - /volume1/Docker/volumes/nginx-proxy-manager/data:/data
      - /usr/builtin/etc/certificate:/etc/ssl/certs
      - /volume1/.@plugins/AppCentral/letsencrypt/.CertBot/config/live:/etc/letsencrypt
    depends_on:
      - nginx-internal-db
  nginx-internal-db:
    container_name: nginx-internal-db
    restart: always
    image: 'jc21/mariadb-aria:latest'
    environment:
      MYSQL_ROOT_PASSWORD: 'npm'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'npm'
    networks: 
      docker-net-0: 
        ipv4_address: 192.168.114.102
    volumes:
      - /volume1/Docker/volumes/mysql:/var/lib/mysql
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 21600
    restart: always
  nginx-external:
    container_name: nginx-external
    restart: always
    image: lscr.io/linuxserver/nginx:latest
    networks:
      bridge-net-0: {}
    ports:
      - 443:443
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /volume1/Docker/volumes/nginx-external/config:/config
      - /usr/builtin/etc/certificate:/etc/ssl/certs:ro
      - /usr/builtin/etc/certificate:/config/keys:ro
  
  nextcloud-test:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud-test
    networks: 
      docker-net-0: 
        ipv4_address: 192.168.114.116
      bridge-net-0: {}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - 32680:80
    volumes:
      - /volume1/Docker/volumes/nextcloud/data:/data
      - /volume1/Docker/volumes/nextcloud/config:/config
    restart: always
    depends_on:
      - nextcloud-db
  
  nextcloud-db:
    image: mariadb
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      bridge-net-0: {}
    ports:
      - "6606:3306"
    volumes:
      - /volume1/Docker/volumes/nextcloud/database:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=my-cool-bicycle
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=my-next-bicycle-cloud
    restart: always
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      bridge-net-0: {}
networks: 
  docker-net-0:
    external: true
  docker-net-1:
    external: true
  bridge-net-0: 
    external: true